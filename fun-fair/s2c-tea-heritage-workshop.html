<!DOCTYPE html>

<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #132a1e;
  }
  #canvas-container {
    position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }
  .serif-tc { font-family: 'Noto Serif TC', serif; }
  .glass {
    background: rgba(16, 38, 27, 0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.16);

  .glass-light {
    background: rgba(248, 251, 249, 0.93);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    border-color: #6ee7b7;
    box-shadow: 0 4px 14px rgba(31, 122, 76, 0.45);

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @keyframes pulseRing {
    0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(217, 78, 42, 0.6); }
    70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(217, 78, 42, 0); }
    100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(217, 78, 42, 0); }

  .pulse-cta { animation: pulseRing 2s infinite; }
</style>

<body>
<div id="canvas-container" aria-label="S2C 茗茶非遺坊 3D 場景"></div>

<!-- TOP HEADER BAR -->
<header class="fixed top-3 left-3 right-3 z-20 flex items-center justify-between gap-2 pointer-events-none">

    <!-- Floorplan -->
    <div id="ctrl-floorplan" class="hidden space-y-1 text-xs text-emerald-900">
      <div>• 一張長檯 · 左入右出</div>
      <div>• 中間擋板防球彈入水杯</div>

    </div>
  </div>
</aside>

<!-- BOTTOM STAGE SWITCHER DOCK -->
<nav class="fixed bottom-3 left-1/2 -translate-x-1/2 z-20 max-w-[96vw] glass p-1.5 rounded-2xl shadow-2xl flex items-center gap-1 overflow-x-auto no-scrollbar pointer-events-auto">
  <button type="button" data-view="overview" class="nav-btn active whitespace-nowrap px-3 py-2 rounded-xl text-xs font-bold text-emerald-100 border border-transparent hover:bg-white/10">

  </button>
  <button type="button" data-view="stage1" class="nav-btn whitespace-nowrap px-3 py-2 rounded-xl text-xs font-bold text-emerald-100 border border-transparent hover:bg-white/10">

<script>
(function() {
  // =========================================================
  // 1. WEB AUDIO SYNTHESIZED SFX
  // =========================================================
  let audioCtx = null;
  let soundEnabled = true;

  function ensureAudio() {
    if (!soundEnabled) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  function playBambooClack() {
    const ctx = ensureAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(340, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(145, ctx.currentTime + 0.09);
    gain.gain.setValueAtTime(0.22, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.11);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.12);
  }

  function playSingleWoodTap() {
    const ctx = ensureAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(560, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(195, ctx.currentTime + 0.055);
    gain.gain.setValueAtTime(0.22, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.065);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.07);
  }

  function playChime() {
    const ctx = ensureAudio();
    if (!ctx) return;
    [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
      gain.gain.setValueAtTime(0.14, ctx.currentTime + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.38);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.08);
      osc.stop(ctx.currentTime + i * 0.08 + 0.4);
    });
  }

  function playPourDrop() {
    const ctx = ensureAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    const base = 360 + stage2Level * 4.5;
    osc.frequency.setValueAtTime(base, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(base + 95, ctx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.05, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.065);
  }

  // =========================================================
  // 2. PROCEDURAL HIGH-RES PBR TEXTURES & BUMP MAPS
  // =========================================================
  function makeWoodPair(baseHex, grainHex) {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = baseHex;
    ctx.fillRect(0, 0, 512, 512);

    const b = document.createElement('canvas');
    b.width = 512; b.height = 512;
    const bctx = b.getContext('2d');
    bctx.fillStyle = '#808080';
    bctx.fillRect(0, 0, 512, 512);

    for (let i = 0; i < 120; i++) {
      const y = Math.random() * 512;
      const w = 1 + Math.random() * 3.5;
      const dy1 = (Math.random() - 0.5) * 16;
      const dy2 = (Math.random() - 0.5) * 16;

      ctx.strokeStyle = grainHex;
      ctx.globalAlpha = 0.09 + Math.random() * 0.16;
      ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(0, y);
      ctx.bezierCurveTo(170, y + dy1, 340, y + dy2, 512, y); ctx.stroke();

      bctx.strokeStyle = (i % 2 === 0) ? '#606060' : '#a0a0a0';
      bctx.globalAlpha = 0.25;
      bctx.lineWidth = w;
      bctx.beginPath(); bctx.moveTo(0, y);
      bctx.bezierCurveTo(170, y + dy1, 340, y + dy2, 512, y); bctx.stroke();
    }
    const map = new THREE.CanvasTexture(c);
    const bump = new THREE.CanvasTexture(b);
    map.wrapS = map.wrapT = bump.wrapS = bump.wrapT = THREE.RepeatWrapping;
    map.encoding = THREE.sRGBEncoding;
    return { map, bump };
  }

  function makeCourtyardTileTexture() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ddd6c7';
    ctx.fillRect(0, 0, 512, 512);
    const step = 64;
    for (let x = 0; x < 512; x += step) {
      for (let y = 0; y < 512; y += step) {
        const shade = ((x / step + y / step) % 2 === 0) ? '#e5dfd2' : '#d8d1c2';
        ctx.fillStyle = shade;
        ctx.fillRect(x + 2, y + 2, step - 4, step - 4);
        // subtle concrete speckle
        ctx.fillStyle = 'rgba(120,110,95,0.06)';
        ctx.fillRect(x + 8 + (x % 13), y + 10 + (y % 11), 14, 14);
      }
    }
    ctx.strokeStyle = '#b9b09e';
    ctx.lineWidth = 2;
    for (let i = 0; i <= 512; i += step) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(9, 9);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function makeBambooWeaveTexture() {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#c89e5a';
    ctx.fillRect(0, 0, 256, 256);
    for (let y = 0; y < 256; y += 16) {
      for (let x = 0; x < 256; x += 16) {
        ctx.fillStyle = ((x / 16 + y / 16) % 2 === 0) ? '#dfb977' : '#ad803c';
        ctx.fillRect(x + 1, y + 1, 14, 14);
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(3, 3);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function makeBlueWhiteCupTexture() {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 128;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fcfdff';
    ctx.fillRect(0, 0, 256, 128);
    ctx.strokeStyle = '#1e40af';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(256, 14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 114); ctx.lineTo(256, 114); ctx.stroke();
    for (let x = 16; x < 256; x += 48) {
      ctx.beginPath(); ctx.arc(x, 64, 13, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#2563eb';
      ctx.beginPath(); ctx.arc(x, 64, 5, 0, Math.PI * 2); ctx.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function makeBannerTexture() {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 256;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 1024, 256);
    g.addColorStop(0, '#103322');
    g.addColorStop(0.5, '#1b5436');
    g.addColorStop(1, '#103322');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1024, 256);

    ctx.strokeStyle = '#eab95a';
    ctx.lineWidth = 10;
    ctx.strokeRect(18, 18, 988, 220);
    ctx.lineWidth = 2;
    ctx.strokeRect(32, 32, 960, 192);

    ctx.fillStyle = '#c83e2b';
    ctx.fillRect(68, 72, 76, 112);
    ctx.fillStyle = '#fff8ec';
    ctx.font = 'bold 34px "Noto Serif TC", serif';
    ctx.textAlign = 'center';
    ctx.fillText('非', 106, 115);
    ctx.fillText('遺', 106, 162);

    ctx.fillStyle = '#fff9ec';
    ctx.font = '900 78px "Noto Serif TC", serif';
    ctx.textAlign = 'center';
    ctx.fillText('S2C 茗茶非遺坊', 530, 126);

    ctx.fillStyle = '#f5d284';
    ctx.font = '700 30px "Noto Sans TC", sans-serif';
    ctx.fillText('茶館見習生大挑戰 · 搖青 · 七分滿 · 叩指禮', 530, 192);

    ctx.fillStyle = '#4ade80';
    ctx.beginPath(); ctx.ellipse(905, 118, 34, 14, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#86efac';
    ctx.beginPath(); ctx.ellipse(935, 146, 26, 11, 0.3, 0, Math.PI * 2); ctx.fill();

    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 8;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function makeSixTeasPosterTexture() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 640;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#faf5e8';
    ctx.fillRect(0, 0, 512, 640);
    ctx.strokeStyle = '#1f7a4c';
    ctx.lineWidth = 12;
    ctx.strokeRect(16, 16, 480, 608);

    ctx.fillStyle = '#133122';
    ctx.font = '900 44px "Noto Serif TC", serif';
    ctx.textAlign = 'center';
    ctx.fillText('中國六大茶類', 256, 86);
    ctx.font = '500 20px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#425e4f';
    ctx.fillText('同源茶樹 · 六種發酵工藝', 256, 124);

    const teas = [
      { name: '綠茶', sub: '殺青 · 不發酵', col: '#65a30d' },
      { name: '白茶', sub: '萎凋 · 輕微發酵', col: '#d4d4aa' },
      { name: '黃茶', sub: '悶黃 · 輕發酵', col: '#eab308' },
      { name: '烏龍', sub: '做青 · 半發酵', col: '#d97706' },
      { name: '紅茶', sub: '發酵 · 全發酵', col: '#b91c1c' },
      { name: '黑茶', sub: '渥堆 · 後發酵', col: '#572812' }
    ];
    teas.forEach((t, idx) => {
      const col = idx % 2;
      const row = Math.floor(idx / 2);
      const cx = 148 + col * 216;
      const cy = 225 + row * 145;
      ctx.fillStyle = t.col;
      ctx.beginPath(); ctx.arc(cx, cy, 42, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.stroke();
      ctx.fillStyle = '#132a1e';
      ctx.font = '700 28px "Noto Serif TC", serif';
      ctx.fillText(t.name, cx, cy + 72);
      ctx.fillStyle = '#4b5563';
      ctx.font = '500 17px "Noto Sans TC", sans-serif';
      ctx.fillText(t.sub, cx, cy + 96);
    });
    const tex = new THREE.CanvasTexture(c);

  function addFloorArrow(x1, z1, x2, z2, colorHex) {
    const dir = new THREE.Vector3(x2 - x1, 0, z2 - z1);
    flowGroup.add(new THREE.ArrowHelper(dir.clone().normalize(), new THREE.Vector3(x1, 0.03, z1), dir.length(), colorHex, 0.32, 0.22));
  }
  addFloorArrow(-1.5, 1.95, -0.68, 1.95, 0x1f7a4c);
  addFloorArrow(-0.48, 1.95, 0.42, 1.95, 0xd94e2a);
  addFloorArrow(0.58, 1.95, 1.35, 1.95, 0xc98a1b);
  booth.add(flowGroup);

  // =========================================================
  // 10. CAMERA PRESETS & SMOOTH ORBIT
  // =========================================================
  const views = {
    overview: {
      pos: new THREE.Vector3(0.25, 2.85, 5.5),
      target: new THREE.Vector3(0, 1.2, 0.15),
      visitorX: -0.64,
      badge: '全景',
      time: '90 秒 · HK$0',
      title: '茶館見習生',
      desc: '一張長檯 · 左至右闖三關'
    },
    stage1: {
      pos: new THREE.Vector3(-0.64, 1.52, 2.05),
      target: new THREE.Vector3(-0.64, 0.86, 0.70),
      visitorX: -0.64,
      badge: '第一關',
      time: '20 秒',
      title: '搖青大作戰',
      desc: '用竹篩拋接 5 顆紙茶球'
    },
    stage2: {
      pos: new THREE.Vector3(0.46, 1.44, 1.88),
      target: new THREE.Vector3(0.46, 0.88, 0.70),
      visitorX: 0.46,
      badge: '第二關',
      time: '30 秒',
      title: '茶倒七分滿',
      desc: '常溫清水倒至 65%–75%'
    },
    stage3: {
      pos: new THREE.Vector3(0.64, 1.38, 1.82),
      target: new THREE.Vector3(0.48, 0.86, 0.76),
      visitorX: 0.56,
      badge: '第三關',
      time: '25 秒',
      title: '奉茶與叩指禮',
      desc: '雙手鞠躬 · 伸掌禮 · 叩指3下'
    },
    floorplan: {
      pos: new THREE.Vector3(0, 6.8, 0.95),
      target: new THREE.Vector3(0, 0.2, 0.35),
      visitorX: 0.0,
      badge: '俯視圖',
      time: '4 人一更',
      title: '單邊攤位佈局',
      desc: '已隱藏頂棚檢視內部動線'
    }
  };

  let currentView = 'overview';
  let desiredPos = views.overview.pos.clone();
  let desiredTarget = views.overview.target.clone();
  let currentTarget = views.overview.target.clone();
  camera.position.copy(views.overview.pos);
  camera.lookAt(currentTarget);

  let isDragging = false, prevX = 0, prevY = 0, userOverrodeCamera = false;
  const spherical = new THREE.Spherical();
  function syncSphericalFromCamera() {
    spherical.setFromVector3(camera.position.clone().sub(currentTarget));
  }
  container.addEventListener('pointerdown', (e) => {
    isDragging = true; userOverrodeCamera = true;
    prevX = e.clientX; prevY = e.clientY;
    syncSphericalFromCamera();
  });
  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - prevX, dy = e.clientY - prevY;
    prevX = e.clientX; prevY = e.clientY;
    spherical.theta -= dx * 0.007;
    spherical.phi = Math.max(0.14, Math.min(Math.PI / 2 - 0.04, spherical.phi - dy * 0.006));
    camera.position.copy(currentTarget).add(new THREE.Vector3().setFromSpherical(spherical));
    camera.lookAt(currentTarget);
  });
  window.addEventListener('pointerup', () => { isDragging = false; });
  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    userOverrodeCamera = true;
    syncSphericalFromCamera();
    spherical.radius = Math.max(1.3, Math.min(13.5, spherical.radius + e.deltaY * 0.005));
    camera.position.copy(currentTarget).add(new THREE.Vector3().setFromSpherical(spherical));
    camera.lookAt(currentTarget);
  }, { passive: false });

  // =========================================================
  // 11. INTERACTIVE STAGE MECHANICS
  // =========================================================
  let s1Count = 0, s1TossAnim = 0;
  function triggerStage1Toss() {
    playBambooClack();
    s1TossAnim = 1.0;
    teaBalls.forEach((b, idx) => { b.vy = 2.55 + (idx % 3) * 0.35; });
    s1Count = (s1Count >= 5) ? 1 : s1Count + 1;
    document.getElementById('s1-count').textContent = s1Count + ' / 5';
    const fb = document.getElementById('s1-feedback');
    if (s1Count === 5) {
      playChime();
      fb.textContent = '🎉 過關！茶葉香氣四溢，請移步到右邊「第二關：茶倒七分滿」！';
      fb.className = 'text-[11px] font-bold text-emerald-700 leading-snug';
    } else {
      fb.textContent = `做得好！已成功拋接 ${s1Count} 次，繼續點擊拋起竹篩至 5 次過關！`;
      fb.className = 'text-[11px] text-emerald-800 leading-snug';
    }
  }
  document.getElementById('btn-s1-toss').addEventListener('click', triggerStage1Toss);

  let stage2Level = 0, isPouring = false, pourSoundCooldown = 0;
  function updateStage2UI() {
    const pct = Math.round(stage2Level);
    document.getElementById('s2-pct').textContent = pct + '%';
    const bar = document.getElementById('s2-bar');
    bar.style.width = pct + '%';
    bar.className = (pct >= 65 && pct <= 75)
      ? 'h-full bg-emerald-500 transition-all duration-75 rounded-full'
      : (pct > 75)
      ? 'h-full bg-rose-500 transition-all duration-75 rounded-full'
      : 'h-full bg-sky-500 transition-all duration-75 rounded-full';
  }
  function startPour() {
    if (stage2Level >= 100) return;
    isPouring = true; waterStream.visible = true;
  }
  function stopPour() {
    if (!isPouring) return;
    isPouring = false; waterStream.visible = false;
    const pct = Math.round(stage2Level);
    const fb = document.getElementById('s2-feedback');
    if (pct >= 65 && pct <= 75) {
      playChime();
      fb.textContent = `🎉 精準 ${pct}%！完美七分滿，留下三分人情，順利過關！`;
      fb.className = 'text-[11px] font-bold text-emerald-700 leading-snug';
    } else if (pct < 65) {
      fb.textContent = `目前 ${pct}%（未夠七分滿），再按住斟多一點或按「重倒」再試！`;
      fb.className = 'text-[11px] font-bold text-amber-800 leading-snug';
    } else {
      fb.textContent = `哎呀 ${pct}% 太滿了（「茶滿欺人」），按「重倒」把水倒回回收桶再挑戰！`;
      fb.className = 'text-[11px] font-bold text-rose-700 leading-snug';
    }
  }
  const btnPour = document.getElementById('btn-s2-pour');
  btnPour.addEventListener('pointerdown', (e) => { e.preventDefault(); startPour(); });
  window.addEventListener('pointerup', stopPour);
  btnPour.addEventListener('pointerleave', stopPour);
  document.getElementById('btn-s2-reset').addEventListener('click', () => {
    stage2Level = 0; isPouring = false; waterStream.visible = false; cupWater.visible = false;
    updateStage2UI();
    const fb = document.getElementById('s2-feedback');
    fb.textContent = '「茶倒七分滿，留下三分是人情」：只用常溫清水，一口氣倒到綠色目標線內即過關！';
    fb.className = 'text-[11px] text-emerald-800 leading-snug';
  });

  // Stage 3: 3 Etiquette Modes ('tap' = 叩指禮, 'bow' = 雙手奉茶＋微鞠躬, 'palm' = 伸掌禮)
  let s3Mode = 'tap';
  let s3AnimTime = -1;
  let s3TapsPlayed = [false, false, false];

  function triggerStage3Mode(mode) {
    s3Mode = mode;
    s3AnimTime = 0;
    s3TapsPlayed = [false, false, false];
    kouzhiHandGroup.visible = (mode === 'tap');
    twoHandsGroup.visible = (mode === 'bow');
    openPalmGroup.visible = (mode === 'palm');
    cupWater.visible = true;
    cupWater.scale.y = 0.68;
    cupWater.position.y = 0.01 + (0.145 * 0.68) / 2;
    if (mode === 'bow' || mode === 'palm') playChime();
  }
  function triggerStage3Demo() { triggerStage3Mode('tap'); }

  document.getElementById('btn-s3-tap').addEventListener('click', () => triggerStage3Mode('tap'));
  document.getElementById('btn-s3-bow').addEventListener('click', () => triggerStage3Mode('bow'));
  document.getElementById('btn-s3-palm').addEventListener('click', () => triggerStage3Mode('palm'));

  document.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const res = document.getElementById('s3-quiz-result');
      res.classList.remove('hidden');
      if (btn.dataset.ans === 'correct') {
        playChime();
        floatingBookmark.visible = true;
        res.textContent = '✅ 答對了！白族三道茶正是「一苦、二甜、三回味」，獲得 S2C 手寫茶韻書籤！';
        res.className = 'text-[11px] font-bold text-emerald-700';
      } else {
        res.textContent = '再想想喔～提示：先苦、再甜、最後餘韻悠長！';
        res.className = 'text-[11px] font-bold text-rose-700';
      }
    });
  });

  // View Switcher (handles canopy hiding & 1st-person visitor hiding!)
  function setView(viewName) {
    currentView = viewName;
    const v = views[viewName];
    desiredPos.copy(v.pos);
    desiredTarget.copy(v.target);
    userOverrodeCamera = false;

    document.getElementById('stage-badge').textContent = v.badge;
    document.getElementById('stage-time').textContent = v.time;
    document.getElementById('stage-title').textContent = v.title;
    document.getElementById('stage-desc').textContent = v.desc;

    ['overview', 'stage1', 'stage2', 'stage3', 'floorplan'].forEach(k => {
      document.getElementById('ctrl-' + k).classList.toggle('hidden', k !== viewName);
    });
    document.querySelectorAll('.nav-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.view === viewName);
    });

    // FIX #2: Hide roof canopy & banner in top-down floorplan view so nothing blocks the layout!
    roofGroup.visible = (viewName !== 'floorplan');

    // FIX #3: Hide full-body visitor in close-up 1st-person stage views so camera is 100% unobstructed!
    visitor.visible = (viewName === 'overview' || viewName === 'floorplan');

    // FIX #4: Show anatomically clear close-up Kouzhi hand in Stage 3!
    kouzhiHandGroup.visible = (viewName === 'stage3');
    if (viewName === 'stage3') {
      floatingBookmark.visible = true;
      triggerStage3Mode('tap');
    } else {
      floatingBookmark.visible = false;
      twoHandsGroup.visible = false;
      openPalmGroup.visible = false;
      s3AnimTime = -1;
      if (!isPouring) waterStream.visible = false;
    }

    flowGroup.visible = (viewName === 'overview' || viewName === 'floorplan');
  }

  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => { stopAutoTour(); setView(btn.dataset.view); });
  });

  // Auto Tour
  let tourInterval = null;
  const tourOrder = ['overview', 'stage1', 'stage2', 'stage3', 'floorplan'];
  let tourIdx = 0;
  function stopAutoTour() {
    if (tourInterval) {
      clearInterval(tourInterval); tourInterval = null;
      document.getElementById('tour-icon').textContent = '▶';
      document.getElementById('tour-text').textContent = '自動導覽';
    }
  }
  document.getElementById('btn-tour').addEventListener('click', () => {
    if (tourInterval) { stopAutoTour(); return; }
    document.getElementById('tour-icon').textContent = '⏸';
    document.getElementById('tour-text').textContent = '導覽中';
    tourIdx = tourOrder.indexOf(currentView);
    const stepTour = () => {
      tourIdx = (tourIdx + 1) % tourOrder.length;
      const next = tourOrder[tourIdx];
      setView(next);
      if (next === 'stage1') triggerStage1Toss();
      if (next === 'stage2') {
        stage2Level = 0; isPouring = true; waterStream.visible = true;
        setTimeout(() => { if (currentView === 'stage2') stopPour(); }, 1850);
      }
    };
    stepTour();
    tourInterval = setInterval(stepTour, 5200);
  });

  // Daylight / Golden Lantern Lighting Toggle
  let isGoldenMode = false;
  document.getElementById('btn-light').addEventListener('click', () => {
    isGoldenMode = !isGoldenMode;
    if (isGoldenMode) {
      skyUniforms.topColor.value.setHex(0x162038);
      skyUniforms.bottomColor.value.setHex(0xc26d47);
      skyUniforms.sunColor.value.setHex(0xff8c42);
      scene.fog.color.setHex(0x282738);
      sunLight.color.setHex(0xff9e5e);
      sunLight.intensity = 0.55;
      hemiLight.intensity = 0.38;
      lanternLights.forEach(l => { l.light.intensity = 1.45; l.mat.emissiveIntensity = 1.25; });
      document.getElementById('light-icon').textContent = '🏮';
      document.getElementById('light-text').textContent = '黃昏燈籠';
    } else {
      skyUniforms.topColor.value.setHex(0x5ba8e6);
      skyUniforms.bottomColor.value.setHex(0xeaf5ee);
      skyUniforms.sunColor.value.setHex(0xfff4c2);
      scene.fog.color.setHex(0xdceee8);
      sunLight.color.setHex(0xfff4d6);
      sunLight.intensity = 1.15;
      hemiLight.intensity = 0.52;
      lanternLights.forEach(l => { l.light.intensity = 0.0; l.mat.emissiveIntensity = 0.35; });
      document.getElementById('light-icon').textContent = '☀️';
      document.getElementById('light-text').textContent = '日景';
    }
  });

  document.getElementById('btn-sound').addEventListener('click', (e) => {
    soundEnabled = !soundEnabled;
    e.currentTarget.textContent = soundEnabled ? '🔊' : '🔇';
  });
  document.getElementById('btn-info-toggle').addEventListener('click', () => {
    document.getElementById('info-panel').classList.toggle('hidden');
  });

  // =========================================================
  // 12. MAIN ANIMATION LOOP
  // =========================================================
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.getElapsedTime();

    if (!userOverrodeCamera) {
      camera.position.lerp(desiredPos, 1 - Math.exp(-4.8 * dt));
      currentTarget.lerp(desiredTarget, 1 - Math.exp(-5.2 * dt));
      camera.lookAt(currentTarget);
    }

    // Drifting clouds & wind sway
    clouds.forEach((c, i) => {
      c.position.x += dt * (0.28 + (i % 3) * 0.08);
      if (c.position.x > 26) c.position.x = -26;
    });
    bambooStreamers.forEach(b => { b.group.rotation.z = Math.sin(t * 1.4 + b.phase) * 0.03; });
    lanterns.forEach(l => {
      l.group.rotation.z = Math.sin(t * 1.8 + l.phase) * 0.06;
      l.group.rotation.x = Math.cos(t * 1.3 + l.phase) * 0.03;
    });

    // Subtle floating sparkles
    sparkles.rotation.y = t * 0.08;
    sparkles.position.y = Math.sin(t * 0.8) * 0.06;

    // Host A waving bookmark warmly
    hostA.userData.armL.rotation.z = -2.25 + Math.sin(t * 3.6) * 0.18;
    hostA.userData.armL.rotation.x = -0.25;
    hostA.userData.armR.rotation.z = 0.12;
    hostA.userData.head.rotation.y = Math.sin(t * 1.5) * 0.16;

    // Visitor smooth walk in Overview / Floorplan
    if (visitor.visible) {
      visitor.position.x += (views[currentView].visitorX - visitor.position.x) * Math.min(1, dt * 4.0);
      visitor.position.y = Math.abs(Math.sin(t * 2.4)) * 0.015;
    }

    // Stage 1: Bamboo tray toss physics
    if (s1TossAnim > 0) {
      s1TossAnim = Math.max(0, s1TossAnim - dt * 2.8);
      trayGroup.position.y = tableY + 0.05 + Math.sin(s1TossAnim * Math.PI) * 0.12;
      trayGroup.rotation.x = -Math.sin(s1TossAnim * Math.PI) * 0.16;
    } else {
      trayGroup.position.y = tableY + 0.05;
      trayGroup.rotation.x = 0;
    }
    teaBalls.forEach(b => {
      if (b.vy !== 0 || b.y > b.base.y) {
        b.y += b.vy * dt; b.vy -= 9.8 * dt;
        b.mesh.rotation.x += b.rotSpeed.x * dt;
        b.mesh.rotation.y += b.rotSpeed.y * dt;
        if (b.y <= b.base.y) {
          b.y = b.base.y;
          b.vy = (Math.abs(b.vy) > 0.7) ? -b.vy * 0.28 : 0;
        }
        b.mesh.position.y = b.y;
      }
    });

    // Stage 2 & Stage 3 Teapot Pouring + Accurate 3-Tap Kouzhi Ceremony
    const stage3Pouring = (currentView === 'stage3' && s3Mode === 'tap' && s3AnimTime >= 0 && s3AnimTime < 2.1);

    if (isPouring || stage3Pouring) {
      teapotGroup.position.lerp(new THREE.Vector3(0.60, tableY + 0.33, tableZ + 0.02), dt * 9);
      teapotGroup.rotation.z += (0.68 - teapotGroup.rotation.z) * dt * 9;
      waterStream.visible = true;

      if (isPouring) {
        stage2Level = Math.min(100, stage2Level + dt * 38);
        cupWater.visible = stage2Level > 1;
        const frac = stage2Level / 100;
        cupWater.scale.y = Math.max(0.02, frac);
        cupWater.position.y = 0.01 + (0.145 * frac) / 2;
        updateStage2UI();
        pourSoundCooldown -= dt;
        if (pourSoundCooldown <= 0) { playPourDrop(); pourSoundCooldown = 0.11; }
        if (stage2Level >= 100) stopPour();
      }
    } else {
      teapotGroup.position.lerp(teapotHomePos, dt * 6);
      teapotGroup.rotation.z += (0 - teapotGroup.rotation.z) * dt * 6;
      waterStream.visible = false;
    }

    // Stage 3 Etiquette Animations (叩指禮 / 雙手奉茶＋微鞠躬 / 伸掌禮)
    if (currentView === 'stage3' && s3AnimTime >= 0) {
      s3AnimTime += dt;
      if (s3Mode === 'bow') {
        const p = Math.sin(Math.min(1, s3AnimTime / 1.6) * Math.PI);
        twoHandsGroup.position.z = twoHandsBasePos.z - p * 0.24;
        twoHandsGroup.position.y = twoHandsBasePos.y + p * 0.06;
        twoHandsGroup.rotation.x = p * 0.14;
        hostC.rotation.x = p * 0.24; // Tea Master bows back politely!
        hostC.userData.armL.rotation.x = -p * 0.55;
        hostC.userData.armR.rotation.x = -p * 0.55;
        if (s3AnimTime > 2.0) { s3AnimTime = -1; hostC.rotation.x = 0; }
      } else if (s3Mode === 'palm') {
        const p = Math.sin(Math.min(1, s3AnimTime / 1.5) * Math.PI);
        openPalmGroup.position.z = openPalmBasePos.z - p * 0.14;
        openPalmGroup.position.x = openPalmBasePos.x - p * 0.06;
        openPalmGroup.rotation.y = p * 0.25;
        hostC.userData.head.rotation.x = p * 0.26; // Polite nod & smile
        if (s3AnimTime > 1.9) { s3AnimTime = -1; hostC.userData.head.rotation.x = 0; }
      } else {
      hostC.userData.armL.rotation.x = (s3AnimTime < 2.1) ? -0.7 : 0;

      const tapTimes = [0.45, 0.95, 1.45];
      let dip = 0;
      let rippleAlpha = 0;
      let rippleScale = 1;

      tapTimes.forEach((tt, idx) => {
        const diff = s3AnimTime - tt;
        // Finger descends then lifts over 0.28s window
        if (diff >= -0.14 && diff <= 0.14) {
          dip = Math.max(dip, Math.cos((diff / 0.14) * (Math.PI / 2)));
        }
        // Trigger wood tap SFX right at contact moment
        if (diff >= 0 && !s3TapsPlayed[idx]) {
          s3TapsPlayed[idx] = true;
          playSingleWoodTap();
        }
        // Expanding golden ripple right after contact
        if (diff >= 0 && diff <= 0.42) {
          const p = diff / 0.42;
          rippleAlpha = Math.max(rippleAlpha, (1 - p) * 0.9);
          rippleScale = Math.max(rippleScale, 1 + p * 3.0);
        }
      });

      // Dip wrist + pitch bent index/middle fingers down onto tabletop
      kouzhiHandGroup.position.y = kouzhiBaseY + 0.022 - dip * 0.022;
      kouzhiFingersPivot.rotation.x = -0.12 + dip * 0.24;
      tapRipple.material.opacity = rippleAlpha;
      tapRipple.scale.setScalar(rippleScale);

      if (s3AnimTime > 2.4) {
        s3AnimTime = -1;
        tapRipple.material.opacity = 0;
      }
      }
    } else {
      hostC.rotation.x += (0 - hostC.rotation.x) * dt * 5;
      hostC.userData.head.rotation.x += (0 - hostC.userData.head.rotation.x) * dt * 5;
      hostC.userData.armR.rotation.x += (0 - hostC.userData.armR.rotation.x) * dt * 5;
      kouzhiHandGroup.position.y = kouzhiBaseY + 0.022;
      kouzhiFingersPivot.rotation.x = -0.12;
      tapRipple.material.opacity = 0;
      hostC.userData.armL.rotation.x += (0 - hostC.userData.armL.rotation.x) * dt * 5;
    }

    if (floatingBookmark.visible) {
      floatingBookmark.rotation.y = t * 1.4;
      floatingBookmark.position.y = tableY + 0.44 + Math.sin(t * 2.8) * 0.05;
    }

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  window.onload = function() {
    setView('overview');
    animate();
  };
})();
</script>
</body>
</html>
